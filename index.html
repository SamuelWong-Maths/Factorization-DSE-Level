<style>
:root{--ink:#18344f;--blue:#1769aa;--green:#21875a;--bg:#edf4f8;--line:#c8d8e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}.app{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.panel{width:min(1280px,100%);min-width:0;padding:24px;background:#fff;border-radius:20px;box-shadow:0 10px 32px #17324d1f}.hidden{display:none!important}button{border:0;border-radius:10px;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .1s,opacity .15s}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #1769aa;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.15fr);gap:24px;align-items:stretch}.left-col,.right-col{display:flex;flex-direction:column}.question-math{width:100%;min-height:85px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;overflow-x:auto;padding:8px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0}.answer-math{width:100%;max-width:540px;min-height:56px;display:block;margin:6px auto 10px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;font-size:1.45rem;background:#fff}.answer-math:focus-within{border-color:var(--blue)}math-field::part(menu-toggle),math-field::part(virtual-keyboard-toggle){display:none}.keyboard{width:100%;max-width:540px;margin:auto;padding:10px;border:1px solid var(--line);border-radius:14px;background:#f2f7fb}.key-row{display:grid;gap:6px;margin:6px 0}.variables{grid-template-columns:repeat(8,1fr)}.numbers{grid-template-columns:repeat(10,1fr)}.operators{grid-template-columns:repeat(7,1fr)}.key{min-height:46px;padding:4px 2px;color:var(--ink);background:#fff;border:1px solid #bcd0dd;border-radius:8px;font-size:1.1rem;box-shadow:0 2px 0 #bcd0dd}.key.special{background:#dceefa;color:#075c9e;border-color:#a9d4f2}.key.delete{background:#ffe5e5;color:#a11;border-color:#f5b8b8}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}.check{background:#21875a}.back{background:#8796aa}.clear{display:block;margin:10px auto 0;background:#e06b65;min-width:190px}.actions button{min-width:150px;min-height:50px;font-size:1rem}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 auto 18px}.stat{padding:9px 16px;border-radius:12px;background:#edf6fb;color:#18344f;font-weight:700}.stat strong{color:#1769aa}.start-button{background:#a7f3d0;color:#14532d;font-weight:800}.target-card{width:min(520px,100%);margin:0 auto 8px;padding:16px 18px;border:1px solid #c8d8e5;border-radius:14px;background:#f8fbfd;text-align:left}.target-label{display:block;margin-bottom:10px;color:#18344f;font-size:1.05rem;font-weight:700}.progress-track{height:18px;overflow:hidden;border-radius:999px;background:#dce7ee}.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#39a96b,#21875a);transition:width .3s ease}.progress-status{min-height:18px;margin:8px 0 0;color:#64748b;font-size:.85rem;text-align:center}.scratch-wrap{flex:1;min-height:480px;display:flex;flex-direction:column;overflow:hidden;border:2px dashed #a5bccc;border-radius:14px;background:#fbfdff;touch-action:none;overscroll-behavior:contain}canvas{flex:1;width:100%;height:100%;min-height:480px;display:block;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#0009;backdrop-filter:blur(2px)}.modal-box{width:min(740px,100%);max-height:90vh;overflow-y:auto;padding:28px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 16px 40px #0004}.solution-wrap{margin:16px 0;padding:14px;overflow-x:auto;text-align:left;border-left:5px solid #c2413a;border-radius:8px;background:#f5f9fc}.solution-math{width:100%;min-height:40px;font-size:1.15rem}@media(max-width:900px){.app{align-items:flex-start}.panel{padding:16px}.layout{grid-template-columns:minmax(0,1fr);gap:18px}.scratch-wrap,canvas{min-height:340px}.actions button{min-width:135px}.question-math{font-size:clamp(1rem,3vw,1.2rem)}}@media(max-width:600px){.panel{padding:14px;border-radius:16px}.stats{gap:8px;margin-bottom:12px}.stat{padding:8px 11px;font-size:.95rem}.target-card{padding:13px}.keyboard{padding:8px}.variables{grid-template-columns:repeat(4,minmax(0,1fr))}.numbers{grid-template-columns:repeat(5,minmax(0,1fr))}.operators{grid-template-columns:repeat(4,minmax(0,1fr))}.key{min-height:44px;font-size:1rem}.actions button{flex:1 1 120px;min-width:0}.clear{min-width:min(190px,100%)}.scratch-wrap,canvas{min-height:300px}.modal{padding:10px}.modal-box{padding:20px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}}@media(max-width:360px){.panel{padding:11px}.target-label{font-size:.95rem}.key-row{gap:4px}.key{padding:4px 1px;font-size:.95rem}.actions{gap:7px}}@media(min-width:901px) and (max-height:900px){.app{padding:12px}.panel{padding:18px}.layout{gap:20px}.scratch-wrap,canvas{min-height:420px}}

<body>
<main class="app"><section id="menu" class="panel text-center">
<h1 class="m-0 text-5xl md:text-6xl font-extrabold text-slate-800 tracking-tight">Factorization (DSE Level)</h1>
<button class="start-button mt-5 min-h-14 min-w-64 text-lg" onclick="startPractice()">Start</button>
</section>
<section id="practice" class="panel hidden">
<div class="stats" aria-live="polite"><div class="stat">Time: <strong id="timer">00:00</strong></div><div class="stat">Correct: <strong id="correctCount">0</strong></div></div>
<div class="target-card"><span id="dailyTargetLabel" class="target-label">Target of today: 0/10</span><div id="targetProgress" class="progress-track" role="progressbar" aria-label="Today's correct-answer target" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="targetBar" class="progress-fill"></div></div></div>
<div class="layout"><div class="left-col"><div id="questionDisplay" class="question-math"></div><p class="my-1 text-center text-sm font-medium text-slate-500">Enter each part in fully factorized form.</p><div id="answers"></div>
<div class="keyboard" id="mathKeyboard" aria-label="Math input keyboard"><div class="key-row variables"><button type="button" class="key" data-insert="x">x</button><button type="button" class="key" data-insert="y">y</button><button type="button" class="key" data-insert="a">a</button><button type="button" class="key" data-insert="b">b</button><button type="button" class="key" data-insert="c">c</button><button type="button" class="key" data-insert="k">k</button><button type="button" class="key" data-insert="m">m</button><button type="button" class="key" data-insert="n">n</button></div>
<div class="key-row numbers"><button type="button" class="key" data-insert="0">0</button><button type="button" class="key" data-insert="1">1</button><button type="button" class="key" data-insert="2">2</button><button type="button" class="key" data-insert="3">3</button><button type="button" class="key" data-insert="4">4</button><button type="button" class="key" data-insert="5">5</button><button type="button" class="key" data-insert="6">6</button><button type="button" class="key" data-insert="7">7</button><button type="button" class="key" data-insert="8">8</button><button type="button" class="key" data-insert="9">9</button></div>
<div class="key-row operators"><button type="button" class="key special" data-insert="(">(</button><button type="button" class="key special" data-insert=")">)</button><button type="button" class="key special" data-insert="+">+</button><button type="button" class="key special" data-insert="-">−</button><button type="button" class="key special" data-insert="^2">x²</button><button type="button" class="key special" data-command="moveToPreviousChar">◀</button><button type="button" class="key delete" data-command="deleteBackward">⌫</button></div></div>
<div class="actions"><button class="check" onclick="checkAnswer()">Check answer</button><button class="back" onclick="backToMenu()">Back</button></div></div>
<div class="right-col"><div class="flex items-center justify-between mb-1 px-1"><span class="font-bold text-slate-600 text-sm tracking-wide uppercase">Scratchpad</span><span class="text-xs text-slate-400">Pencil / finger draft</span></div><div class="scratch-wrap"><canvas id="scratchpad"></canvas></div><button class="clear" onclick="clearScratchpad()">Clear scratchpad</button></div></div>
</section></main>
<div id="feedback" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle"><div class="modal-box"><h2 id="feedbackTitle" class="text-2xl font-bold mb-2"></h2><p id="feedbackText" class="text-slate-700 text-base mb-3"></p><div id="solutionWrap" class="solution-wrap hidden"><div id="solutionDisplay" class="solution-math"></div></div><button id="continueBtn" class="mt-2 min-w-44 bg-sky-600" onclick="closeFeedback()">Continue</button></div></div>
<script>
let currentQuestion=null,activeField=null,canvas=null,ctx=null,drawing=false,mathLiveReady=false;
let correct=0,questionNo=0,startTime=null,timerInterval=null,lastAnswerCorrect=false,dailyProgressReady=Promise.resolve();
const progressDate=new Date(),dailyProgressKey=`factorisation-correct-${progressDate.getFullYear()}-${String(progressDate.getMonth()+1).padStart(2,'0')}-${String(progressDate.getDate()).padStart(2,'0')}`;
async function waitForMathLive(){try{if(window.customElements&&customElements.whenDefined)await customElements.whenDefined('math-field');mathLiveReady=true}catch(e){console.error('Math input failed to initialise:',e)}}
const rand=(min,max,excludes=[])=>{let v,n=0;do{v=Math.floor(Math.random()*(max-min+1))+min;n++}while(excludes.includes(v)&&n<100);return v};
const gcd=(a,b)=>{a=Math.abs(a||0);b=Math.abs(b||0);while(b)[a,b]=[b,a%b];return a||1};
const leadingCoefficient=n=>n===1?'':n===-1?'-':String(n),signedCoefficient=n=>n===1?'+':n===-1?'-':n>0?`+${n}`:String(n),constantTerm=(n,first=false)=>n===0?'':first?String(n):n>0?`+${n}`:String(n),variableTerm=(n,letters,first=false)=>n===0?'':first?`${leadingCoefficient(n)}${letters}`:`${signedCoefficient(n)}${letters}`;
const makeQuestion=(questionTex,answers,solutionTex)=>({questionTex,answers,solutionTex});
function genCommonMN(){const o=rand(2,8),b=rand(2,9),c=rand(2,9),d=rand(2,9),g=gcd(gcd(b,c),d),outer=o*g,q=`${variableTerm(o*b,'m^{2}n^{2}',true)}${variableTerm(-o*c,'m^{2}n')}${variableTerm(-o*d,'mn^{2}')}`,mid=`${o}mn(${variableTerm(b,'mn',true)}${variableTerm(-c,'m')}${variableTerm(-d,'n')})`,ans=g===1?mid:`${outer}mn(${variableTerm(b/g,'mn',true)}${variableTerm(-c/g,'m')}${variableTerm(-d/g,'n')})`;return makeQuestion(q,[ans],g===1?`${q}=${ans}`:`\\begin{aligned}${q}&=${mid}\\\\&=${ans}\\end{aligned}`)}
function genCommonBinomial(){const a=rand(2,10),b=rand(2,10),q=`(x-${a})(x+y)-${b}(x+y)`,ans=`(x+y)(x-${a+b})`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=(x+y)[(x-${a})-${b}]\\\\&=${ans}\\end{aligned}`)}
function genOppositeFactor(){const a=rand(10,20),b=rand(2,9),q=`${a}(x-${b})+x(${b}-x)`,ans=`(x-${b})(${a}-x)`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=${a}(x-${b})-x(x-${b})\\\\&=${ans}\\end{aligned}`)}
function genCommonBinomialSquare(){let a,b,c,d,x,y,g1,g2,n=0;do{a=rand(6,12);b=rand(6,12);c=rand(2,5);d=rand(2,5);x=a-c;y=b-d;g1=gcd(a,b);g2=gcd(x,y);n++}while(a/g1===x/g2&&b/g1===y/g2&&n<30);const f=`(${variableTerm(a,'x',true)}${variableTerm(b,'y')})`,h=`(${variableTerm(c,'x',true)}${variableTerm(d,'y')})`,mid=`${f}(${variableTerm(x,'x',true)}${variableTerm(y,'y')})`,g=g1*g2,ans=g===1?mid:`${g}(${variableTerm(a/g1,'x',true)}${variableTerm(b/g1,'y')})(${variableTerm(x/g2,'x',true)}${variableTerm(y/g2,'y')})`,q=`${f}^{2}-${f}${h}`,sol=g===1?`\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${ans}\\end{aligned}`:`\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${mid}\\\\&=${ans}\\end{aligned}`;return makeQuestion(q,[ans],sol)}
function genGroupingK(){const a=rand(2,10),b=rand(2,10),q=`${variableTerm(a,'x^{3}',true)}${variableTerm(-a,'x^{2}')}${variableTerm(b,'ax^{2}')}${variableTerm(-b,'ax')}`,ans=`${a}x(x-1)(x+${b})`,sol=`\\begin{aligned}${q}&=${a}x^{2}(x-1)+${a*b}x(x-1)\\\\&=${ans}\\end{aligned}`;return makeQuestion(q,[ans],sol)}
function genGroupingXYZ(){const a=rand(2,10),b=rand(2,10),g=gcd(a,b),q=`${variableTerm(a,'x^{2}',true)}${variableTerm(a,'xy')}${variableTerm(a,'xz')}${variableTerm(-b,'x')}${variableTerm(-b,'y')}${variableTerm(-b,'z')}`,mid=`(${variableTerm(a,'x',true)}-${b})(x+y+z)`,ans=g===1?mid:`${g}(${variableTerm(a/g,'x',true)}-${b/g})(x+y+z)`,sol=g===1?`\\begin{aligned}${q}&=${variableTerm(a,'x',true)}(x+y+z)-${b}(x+y+z)\\\\&=${ans}\\end{aligned}`:`\\begin{aligned}${q}&=${variableTerm(a,'x',true)}(x+y+z)-${b}(x+y+z)\\\\&=${mid}\\\\&=${ans}\\end{aligned}`;return makeQuestion(q,[ans],sol)}
function genGroupingABC(){const a=rand(8,20),b=rand(2,7),g=gcd(a,b),q=`${variableTerm(a,'a',true)}${variableTerm(-b,'bc')}${variableTerm(-a,'b')}${variableTerm(b,'ac')}`,mid=`(a-b)(${a}${variableTerm(b,'c')})`,ans=g===1?mid:`${g}(a-b)(${a/g}${variableTerm(b/g,'c')})`,sol=g===1?`\\begin{aligned}${q}&=${variableTerm(a,'a',true)}${variableTerm(-a,'b')}${variableTerm(b,'ac')}${variableTerm(-b,'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${ans}\\end{aligned}`:`\\begin{aligned}${q}&=${variableTerm(a,'a',true)}${variableTerm(-a,'b')}${variableTerm(b,'ac')}${variableTerm(-b,'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${mid}\\\\&=${ans}\\end{aligned}`;return makeQuestion(q,[ans],sol)}
function genSimpleCommonFactor(){const a=rand(2,12),sx=rand(0,1)?1:-1,sy=rand(0,1)?1:-1,q=`${variableTerm(a*sx,'x',true)}${variableTerm(a*sy,'y')}`,ans=`${sx<0?'-':''}${a}(x${sx===sy?'+':'-'}y)`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=${ans}\\end{aligned}`)}
function genNegativeVariableFactor(){const factor=['a','b','c','k','m','n'][rand(0,5)],q=`-${factor}x-${factor}y`,ans=`-${factor}(x+y)`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=-${factor}(x+y)\\end{aligned}`)}
function genNumericAndVariableFactor(){let u=rand(1,7),v=rand(1,7);while(gcd(u,v)!==1){u=rand(1,7);v=rand(1,7)}const g=rand(2,6),sx=rand(0,1)?1:-1,sy=rand(0,1)?1:-1,a=g*u,b=g*v,q=`${variableTerm(sx*a,'x',true)}${variableTerm(sy*b,'x^{2}')}`,outer=`${sx<0?'-':''}${g}x`,bracket=`${u}${variableTerm(sx*sy*v,'x')}`,ans=`${outer}(${bracket})`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=${ans}\\end{aligned}`)}
function genGreatestX2Factor(){let u=rand(2,15),v=rand(2,15);while(gcd(u,v)!==1){u=rand(2,15);v=rand(2,15)}const g=rand(1,5),sx=rand(0,1)?1:-1,sy=rand(0,1)?1:-1,a=g*u,b=g*v,q=`${variableTerm(sx*a,'x^{2}',true)}${variableTerm(sy*b,'x^{3}')}`,bracket=`${u}${variableTerm(sx*sy*v,'x')}`,outer=`${sx<0?'-':''}${g===1?'':g}`,ans=`${outer}x^{2}(${bracket})`;return makeQuestion(q,[ans],`\\begin{aligned}${q}&=${ans}\\end{aligned}`)}
function genPerfectSquare(){const a=rand(-10,10,[0,1,-1]),q=`x^{2}${variableTerm(2*a,'xy')}${variableTerm(a*a,'y^{2}')}`,ans=`(x${variableTerm(a,'y')})^{2}`;return makeQuestion(q,[ans],`${q}=${ans}`)}
function genDifferenceSquares(){const a=rand(2,15),b=rand(2,15),g=gcd(a,b),q=`${a*a}x^{2}-${b*b}y^{2}`,mid=`(${a}x+${b}y)(${a}x-${b}y)`,ans=g===1?mid:`${g*g}(${a/g}x+${b/g}y)(${a/g}x-${b/g}y)`;return makeQuestion(q,[ans],g===1?`${q}=${ans}`:`\\begin{aligned}${q}&=${mid}\\\\&=${ans}\\end{aligned}`)}
function genTrinomial(){const a=rand(3,10),b=-rand(5,20),s=a+b,p=a*b,q=`x^{2}${variableTerm(s,'x')}${constantTerm(p)}`,ans=`(x${constantTerm(a)})(x${constantTerm(b)})`;return makeQuestion(q,[ans],`${q}=${ans}`)}
function genGeneralQuadratic(){const a=rand(2,10),b=rand(-10,10,[0]),c=rand(2,10),d=rand(-10,10,[0]),s=a*d+b*c,g1=gcd(a,b),g2=gcd(c,d),g=g1*g2,q=`${variableTerm(a*c,'x^{2}',true)}${variableTerm(s,'xy')}${variableTerm(b*d,'y^{2}')}`,mid=`(${variableTerm(a,'x',true)}${variableTerm(b,'y')})(${variableTerm(c,'x',true)}${variableTerm(d,'y')})`,ans=g===1?mid:`${g}(${variableTerm(a/g1,'x',true)}${variableTerm(b/g1,'y')})(${variableTerm(c/g2,'x',true)}${variableTerm(d/g2,'y')})`;return makeQuestion(q,[ans],g===1?`${q}=${ans}`:`\\begin{aligned}${q}&=${mid}\\\\&=${ans}\\end{aligned}`)}
function genLevelThreeI(){const a=rand(-10,10,[0,1,-1]),c=rand(-10,10,[0,1,-1]),one=`x^{2}${variableTerm(2*a,'xy')}${variableTerm(a*a,'y^{2}')}`,two=`${one}${variableTerm(c,'x')}${variableTerm(a*c,'y')}`,ansA=`(x${variableTerm(a,'y')})^{2}`,ansB=`(x${variableTerm(a,'y')})(x${variableTerm(a,'y')}${constantTerm(c)})`,q=`\\begin{aligned}\\text{(a) }${one}\\\\[4pt]\\text{(b) }${two}\\end{aligned}`,sol=`\\begin{aligned}\\text{(a) }${one}&=${ansA}\\\\\\text{(b) }${two}&=${ansA}${constantTerm(c)}(x${variableTerm(a,'y')})\\\\&=${ansB}\\end{aligned}`;return makeQuestion(q,[ansA,ansB],sol)}

function genLevelThreeIII(){const a=rand(2,10),b=rand(-10,10,[0,1,-1]),c=rand(-10,10,[0,1,-1]),g=gcd(a,Math.abs(b)),ar=a/g,br=b/g,k=gcd(g,Math.abs(c)),outer=g*k,one=`${a*a}x^{2}${variableTerm(2*a*b,'xy')}${variableTerm(b*b,'y^{2}')}`,two=`${one}${variableTerm(c*a,'x')}${variableTerm(c*b,'y')}`,primitive=`(${variableTerm(ar,'x',true)}${variableTerm(br,'y')})`,full=`(${variableTerm(a,'x',true)}${variableTerm(b,'y')})`,ansA=g===1?`${full}^{2}`:`${g*g}${primitive}^{2}`,bracket=`(${variableTerm(a/k,'x',true)}${variableTerm(b/k,'y')}${constantTerm(c/k)})`,ansB=`${outer===1?'':outer}${primitive}${bracket}`,coeff=c*g,lineOne=`${leadingCoefficient(g*g)}${primitive}^{2}${coeff>0?'+':'-'}${Math.abs(coeff)===1?'':Math.abs(coeff)}${primitive}`,common=g===1?primitive:`${g}${primitive}`,group=k===1?`(${variableTerm(a,'x',true)}${variableTerm(b,'y')}${constantTerm(c)})`:`\\left[${variableTerm(a,'x',true)}${variableTerm(b,'y')}${constantTerm(c)}\\right]`,q=`\\begin{aligned}\\text{(a) }&${one}\\\\[6pt]\\text{(b) }&${two}\\end{aligned}`;const finalStep=k===1?'':`\\\\&=${ansB}`;const sol=`\\begin{aligned}\\text{(a) }${one}&=${ansA}\\\\[6pt]\\text{(b) }${two}&=${lineOne}\\\\&=${common}${group}${finalStep}\\end{aligned}`;return makeQuestion(q,[ansA,ansB],sol)}
