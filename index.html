<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Daily Maths Practice: Factorization</title>
  <script src="https://unpkg.com/mathlive"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --ink:#18344f; --blue:#1769aa; --green:#137a4a; --amber:#dda20a; --purple:#7042a6; --bg:#edf4f8; --line:#c8d8e5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#1f2937; font-family:Arial,sans-serif; }
    .app { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:10px; }
    .panel { width:min(1120px,100%); padding:18px; background:#fff; border-radius:18px; box-shadow:0 8px 28px #17324d22; }
    .hidden { display:none !important; }
    button { border:0; border-radius:10px; color:#fff; padding:11px 16px; font-weight:700; cursor:pointer; touch-action:manipulation; }
    button:active { transform:scale(.98); }
    .level-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px; }
    .level { min-height:105px; font-size:1.12rem; }
    .one { background:var(--green); }
    .two { background:var(--amber); color:#2c2100; }
    .three { background:var(--purple); }
    .layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:18px; align-items:start; }
    .question-math { width:100%; min-height:82px; display:block; border:0; background:transparent; font-size:1.45rem; text-align:center; pointer-events:none; }
    .answer-math { width:min(100%,540px); min-height:56px; display:block; margin:7px auto; padding:8px; border:2px solid var(--line); border-radius:10px; font-size:1.45rem; }
    math-field::part(menu-toggle), math-field::part(virtual-keyboard-toggle) { display:none; }
    .keyboard { width:min(100%,570px); margin:auto; padding:9px; border:1px solid var(--line); border-radius:12px; background:#f2f7fb; }
    .key-row { display:grid; gap:7px; margin:7px 0; }
    .variables { grid-template-columns:repeat(7,1fr); }
    .numbers { grid-template-columns:repeat(10,1fr); }
    .operators { grid-template-columns:repeat(7,1fr); }
    .key { min-height:40px; padding:4px; color:var(--ink); background:#fff; border:1px solid #bcd0dd; font-size:1.05rem; }
    .key.special { background:#dceefa; color:#075c9e; }
    .key.delete { background:#ffe5e5; color:#a11; }
    .actions { display:flex; justify-content:center; gap:10px; margin-top:12px; }
    .check { background:#137a4a; }
    .back { background:#64748b; }
    .scratch-wrap { overflow:hidden; border:2px dashed #b8c9d5; border-radius:12px; background:#fbfdff; }
    canvas { width:100%; height:260px; display:block; touch-action:none; cursor:crosshair; }
    .clear { display:block; margin:8px auto 0; background:#c2413a; }
    .modal { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:#0008; }
    .modal-box { width:min(700px,100%); max-height:90vh; overflow:auto; padding:24px; border-radius:16px; background:#fff; text-align:center; }
    .continue { background:#1769aa; }
    .check,
.back,
.clear,
.continue {
  min-width: 170px;
  min-height: 54px;
  padding: 14px 24px;
  font-size: 1.15rem;
  line-height: 1.2;
  white-space: nowrap;
}

.clear {
  min-width: 190px;
  margin-top: 12px;
}

.actions {
  gap: 14px;
}

@media (max-width: 800px) {
  .check,
  .back,
  .clear,
  .continue {
    min-width: 150px;
    min-height: 50px;
    padding: 12px 18px;
    font-size: 1.05rem;
  }

  .clear {
    min-width: 175px;
  }
}
    .solution-wrap { margin:12px 0; padding:12px; overflow:auto; text-align:left; border-left:4px solid #c2413a; border-radius:8px; background:#f5f9fc; }
    .solution-math { width:100%; min-height:40px; border:0; background:transparent; font-size:1.15rem; pointer-events:none; }
    @media (max-width:800px) { .app { align-items:flex-start; padding:7px; } .panel { padding:13px; border-radius:12px; } .layout { grid-template-columns:1fr; gap:10px; } .level-grid { gap:8px; } .level { min-height:82px; padding:10px; font-size:.95rem; } canvas { height:155px; } .key { min-height:35px; } }
    @media (orientation:landscape) and (max-height:820px) { .app { padding:5px; } .panel { padding:10px; } .panel h1 { margin:0; font-size:2.15rem !important; } .level-grid { margin-top:8px; } .level { min-height:65px; padding:8px; } .layout { gap:12px; } .question-math { min-height:54px; } .key-row { margin:4px 0; } .key { min-height:31px; } canvas { height:135px; } .actions { margin-top:7px; } }
  </style>
</head>
<body>
  <main class="app">
    <section id="menu" class="panel text-center">
      <h1 class="m-0 text-6xl font-bold text-slate-1000">Factorization</h1>
      <p class="mt-3 text-slate-800">Choose a level to begin practising.</p>
      <div class="level-grid">
        <button class="level one" onclick="startQuestion(1)">Level One (S2)</button>
        <button class="level two" onclick="startQuestion(2)">Level Two (S3)</button>
        <button class="level three" onclick="startQuestion(3)">Level Three (S3 or above)</button>
      </div>
    </section>

    <section id="practice" class="panel hidden">
      <h2 id="levelTitle" class="m-0 mb-1 text-center text-2xl font-bold text-slate-800"></h2>
      <div class="layout">
        <div>
          <math-field id="questionDisplay" class="question-math" read-only></math-field>
          <p class="my-1 text-center text-slate-600">Enter the expression in fully factorised form.</p>
          <div id="answers"></div>
          <div class="keyboard">
            <div class="key-row variables">
              <button class="key" onclick="insertMath('x')">x</button><button class="key" onclick="insertMath('y')">y</button><button class="key" onclick="insertMath('a')">a</button><button class="key" onclick="insertMath('b')">b</button><button class="key" onclick="insertMath('c')">c</button><button class="key" onclick="insertMath('m')">m</button><button class="key" onclick="insertMath('n')">n</button>
            </div>
            <div class="key-row numbers">
              <button class="key" onclick="insertMath('0')">0</button><button class="key" onclick="insertMath('1')">1</button><button class="key" onclick="insertMath('2')">2</button><button class="key" onclick="insertMath('3')">3</button><button class="key" onclick="insertMath('4')">4</button><button class="key" onclick="insertMath('5')">5</button><button class="key" onclick="insertMath('6')">6</button><button class="key" onclick="insertMath('7')">7</button><button class="key" onclick="insertMath('8')">8</button><button class="key" onclick="insertMath('9')">9</button>
            </div>
            <div class="key-row operators">
              <button class="key special" onclick="insertMath('(')">(</button><button class="key special" onclick="insertMath(')')">)</button><button class="key special" onclick="insertMath('+')">+</button><button class="key special" onclick="insertMath('-')">−</button><button class="key special" onclick="insertMath('^{#?}')">□²</button><button class="key special" onclick="cmdMath('moveToPreviousChar')">◀</button><button class="key delete" onclick="cmdMath('deleteBackward')">⌫</button>
            </div>
          </div>
          <div class="actions"><button class="check" onclick="checkAnswer()">Check answer</button><button class="back" onclick="backToMenu()">Back</button></div>
        </div>
        <div>
          <p class="m-0 mb-2 text-center font-bold text-slate-500">Scratchpad</p>
          <div class="scratch-wrap"><canvas id="scratchpad"></canvas></div>
          <button class="clear" onclick="clearScratchpad()">Clear scratchpad</button>
        </div>
      </div>
    </section>
  </main>

  <div id="feedback" class="modal hidden">
    <div class="modal-box">
      <h2 id="feedbackTitle"></h2>
      <p id="feedbackText"></p>
      <div id="solutionWrap" class="solution-wrap hidden"><math-field id="solutionDisplay" class="solution-math" read-only></math-field></div>
      <button id="continueBtn" class="continue" onclick="closeFeedback()">Continue</button>
    </div>
  </div>

  <script>
    let currentQuestion = null;
    let activeField = null;
    let canvas, ctx, drawing = false;

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const gcd = (a, b) => {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) [a, b] = [b, a % b];
      return a || 1;
    };

    // Like \leadingCoefficient: hides 1 and -1 only before variables.
    const leadingCoefficient = n => n === 1 ? '' : n === -1 ? '-' : String(n);
    // Like \coefficient: supplies a sign; hides 1 and -1 only before variables.
    const signedCoefficient = n => n === 1 ? '+' : n === -1 ? '-' : n > 0 ? `+${n}` : String(n);
    // Constants MUST retain 1: this prevents displays such as 2y+.
    const constantTerm = (n, first = false) => n === 0 ? '' : first ? String(n) : n > 0 ? `+${n}` : String(n);
    const variableTerm = (n, letters, first = false) => n === 0 ? '' : first ? `${leadingCoefficient(n)}${letters}` : `${signedCoefficient(n)}${letters}`;
    const binomial = (a, v, b, w) => `(${variableTerm(a, v, true)}${variableTerm(b, w)})`;
    const makeQuestion = (questionTex, answers, solutionTex) => ({ questionTex, answers, solutionTex });

    function genCommonMN() {
      const outer = rand(2, 8), b = rand(2, 9), c = rand(2, 9), d = rand(2, 9);
      const innerGcd = gcd(gcd(b, c), d);
      const finalOuter = outer * innerGcd;
      const q = `${variableTerm(outer * b, 'm^{2}n^{2}', true)}${variableTerm(-outer * c, 'm^{2}n')}${variableTerm(-outer * d, 'mn^{2}')}`;
      const mid = `${outer}mn(${variableTerm(b, 'mn', true)}${variableTerm(-c, 'm')}${variableTerm(-d, 'n')})`;
      const answer = innerGcd === 1 ? mid : `${finalOuter}mn(${variableTerm(b / innerGcd, 'mn', true)}${variableTerm(-c / innerGcd, 'm')}${variableTerm(-d / innerGcd, 'n')})`;
      const sol = innerGcd === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genCommonBinomial() {
      const a = rand(2, 10), b = rand(2, 10), s = a + b;
      const q = `(x-${a})(x+y)-${b}(x+y)`;
      const answer = `(x+y)(x-${s})`;
      return makeQuestion(q, [answer], `\\begin{aligned}${q}&=(x+y)[(x-${a})-${b}]\\\\&=${answer}\\end{aligned}`);
    }

    function genOppositeFactor() {
      const a = rand(10, 20), b = rand(2, 9);
      const q = `${a}(x-${b})+x(${b}-x)`;
      const answer = `(x-${b})(${a}-x)`;
      return makeQuestion(q, [answer], `\\begin{aligned}${q}&=${a}(x-${b})-x(x-${b})\\\\&=${answer}\\end{aligned}`);
    }

    function genCommonBinomialSquare() {
      let a, b, c, d, x, y, g1, g2;
      do {
        a = rand(6, 12); b = rand(6, 12); c = rand(2, 5); d = rand(2, 5);
        x = a - c; y = b - d; g1 = gcd(a, b); g2 = gcd(x, y);
      } while (a / g1 === x / g2 && b / g1 === y / g2);
      const f = `(${variableTerm(a, 'x', true)}${variableTerm(b, 'y')})`;
      const h = `(${variableTerm(c, 'x', true)}${variableTerm(d, 'y')})`;
      const mid = `${f}(${variableTerm(x, 'x', true)}${variableTerm(y, 'y')})`;
      const g = g1 * g2;
      const answer = g === 1 ? mid : `${g}(${variableTerm(a / g1, 'x', true)}${variableTerm(b / g1, 'y')})(${variableTerm(x / g2, 'x', true)}${variableTerm(y / g2, 'y')})`;
      const q = `${f}^{2}-${f}${h}`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingK() {
      const a = rand(2, 10), b = rand(2, 10), g = gcd(a, b);
      const q = `${variableTerm(a, 'x^{3}', true)}${variableTerm(-a, 'x^{2}')}${variableTerm(b, 'ax^{2}')}${variableTerm(-b, 'ax')}`;
      const mid = `x(x-1)(${variableTerm(a, 'x', true)}${variableTerm(b, 'a')})`;
      const answer = g === 1 ? mid : `${g}x(x-1)(${variableTerm(a / g, 'x', true)}${variableTerm(b / g, 'a')})`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'x^{2}', true)}(x-1)+${variableTerm(b, 'ax', true)}(x-1)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'x^{2}', true)}(x-1)+${variableTerm(b, 'ax', true)}(x-1)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingXYZ() {
      const a = rand(2, 10), b = rand(2, 10), g = gcd(a, b);
      const q = `${variableTerm(a, 'x^{2}', true)}${variableTerm(a, 'xy')}${variableTerm(a, 'xz')}${variableTerm(-b, 'x')}${variableTerm(-b, 'y')}${variableTerm(-b, 'z')}`;
      const mid = `(${variableTerm(a, 'x', true)}-${b})(x+y+z)`;
      const answer = g === 1 ? mid : `${g}(${variableTerm(a / g, 'x', true)}-${b / g})(x+y+z)`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'x', true)}(x+y+z)-${b}(x+y+z)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'x', true)}(x+y+z)-${b}(x+y+z)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingABC() {
      const a = rand(8, 20), b = rand(2, 7), g = gcd(a, b);
      const q = `${variableTerm(a, 'a', true)}${variableTerm(-b, 'bc')}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}`;
      const mid = `(a-b)(${constantTerm(a, true)}${variableTerm(b, 'c')})`;
      const answer = g === 1 ? mid : `${g}(a-b)(${constantTerm(a / g, true)}${variableTerm(b / g, 'c')})`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'a', true)}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}${variableTerm(-b, 'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'a', true)}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}${variableTerm(-b, 'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genPerfectSquare() {
      let a;
      do { a = rand(-10, 10); } while (!a || Math.abs(a) === 1);
      const q = `x^{2}${variableTerm(2 * a, 'xy')}${variableTerm(a * a, 'y^{2}')}`;
      const answer = `(x${variableTerm(a, 'y')})^{2}`;
      return makeQuestion(q, [answer], `${q}=${answer}`);
    }

    function genDifferenceSquares() {
      const a = rand(2, 15), b = rand(2, 15), g = gcd(a, b);
      const q = `${a * a}x^{2}-${b * b}y^{2}`;
      const mid = `(${a}x+${b}y)(${a}x-${b}y)`;
      const answer = g === 1 ? mid : `${g * g}(${a / g}x+${b / g}y)(${a / g}x-${b / g}y)`;
      return makeQuestion(q, [answer], g === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`);
    }

    function genTrinomial() {
      const a = rand(3, 10), b = -rand(5, 20), s = a + b, p = a * b;
      const q = `x^{2}${variableTerm(s, 'x')}${constantTerm(p)}`;
      const answer = `(x${constantTerm(a)})(x${constantTerm(b)})`;
      return makeQuestion(q, [answer], `${q}=${answer}`);
    }

    function genGeneralQuadratic() {
      let a = rand(2, 10), b = rand(-10, 10), c = rand(2, 10), d = rand(-10, 10);
      if (!b) b = 1;
      if (!d) d = -1;
      const s = a * d + b * c, g1 = gcd(a, b), g2 = gcd(c, d), g = g1 * g2;
      const q = `${variableTerm(a * c, 'x^{2}', true)}${variableTerm(s, 'xy')}${variableTerm(b * d, 'y^{2}')}`;
      const mid = `${binomial(a, 'x', b, 'y')}${binomial(c, 'x', d, 'y')}`;
      const answer = g === 1 ? mid : `${g}${binomial(a / g1, 'x', b / g1, 'y')}${binomial(c / g2, 'x', d / g2, 'y')}`;
      return makeQuestion(q, [answer], g === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`);
    }



    function genLevelThreeI() {
      let a = rand(-10, 10);
      let c = rand(-10, 10);

      while (a === 0 || a === 1 || a === -1) {
        a = rand(-10, 10);
      }

      while (c === 0 || c === 1 || c === -1) {
        c = rand(-10, 10);
      }

      const one = `x^{2}${variableTerm(2 * a, 'xy')}${variableTerm(a * a, 'y^{2}')}`;
      const two = `${one}${variableTerm(c, 'x')}${variableTerm(a * c, 'y')}`;

      const answerOne = `(x${variableTerm(a, 'y')})^{2}`;
      const answerTwo =
        `(x${variableTerm(a, 'y')})` +
        `(x${variableTerm(a, 'y')}${constantTerm(c)})`;

      const q =
        `\\text{(a) }${one}` +
        `\\qquad` +
        `\\text{(b) }${two}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${one} &= ${answerOne}\\\\` +
        `\\text{(b) }${two} ` +
        `&= (x${variableTerm(a, 'y')})^{2}` +
        `${constantTerm(c)}(x${variableTerm(a, 'y')})\\\\` +
        `&= ${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function genLevelThreeII() {
      const a = rand(2, 15);
      const b = rand(2, 15);

      let c = rand(-10, 10);
      while (c === 0 || c === 1 || c === -1) {
        c = rand(-10, 10);
      }

      const g = gcd(a, b);
      const u = a / g;
      const v = b / g;

      const h = gcd(g, Math.abs(c));
      const finalCoefficient = g * h;

      const qOne =
        `${a * a}x^{2}` +
        `-${b * b}y^{2}`;

      const qTwo =
        `${qOne}` +
        `${variableTerm(c * a, 'x')}` +
        `${variableTerm(c * b, 'y')}`;

      const firstFactor =
        `(${leadingVariableTerm(a, 'x')}` +
        `${variableTerm(b, 'y')})`;

      const secondFactor =
        `(${leadingVariableTerm(a, 'x')}` +
        `${variableTerm(-b, 'y')}` +
        `${constantTerm(c)})`;

      const answerOne =
        g === 1
          ? `(${a}x+${b}y)(${a}x-${b}y)`
          : `${g * g}(${u}x+${v}y)(${u}x-${v}y)`;

      const answerTwo =
        h === 1
          ? `${g}(${u}x+${v}y)` +
            `(${g}x${variableTerm(-g * v, 'y')}${constantTerm(c)})`
          : `${finalCoefficient}` +
            `(${u}x+${v}y)` +
            `(${leadingVariableTerm(g / h, 'x')}` +
            `${variableTerm(-(g / h) * v, 'y')}` +
            `${constantTerm(c / h)})`;

      const q =
        `\\text{(a) }${qOne}` +
        `\\qquad` +
        `\\text{(b) }${qTwo}`;

      const partASolution =
        g === 1
          ? `(${a}x+${b}y)(${a}x-${b}y)`
          : `(${a}x+${b}y)(${a}x-${b}y)`;

      const partBFirstStep =
        `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})` +
        `(${leadingVariableTerm(a, 'x')}${variableTerm(-b, 'y')})` +
        `${constantTerm(c)}` +
        `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})`;

      const partBGroupingStep =
        `${firstFactor}` +
        `${secondFactor}`;

      let finalPartBStep;

      if (h === 1) {
        finalPartBStep =
          `${g}` +
          `(${u}x+${v}y)` +
          `(${g * u}x${variableTerm(-g * v, 'y')}${constantTerm(c)})`;
      } else {
        finalPartBStep =
          `${finalCoefficient}` +
          `(${u}x+${v}y)` +
          `(${leadingVariableTerm(g / h, 'x')}` +
          `${variableTerm(-(g / h) * v, 'y')}` +
          `${constantTerm(c / h)})`;
      }

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${qOne} ` +
        `&= ${partASolution}\\\\` +
        `\\text{(b) }${qTwo} ` +
        `&= ${partBFirstStep}\\\\` +
        `&= ${partBGroupingStep}\\\\` +
        `&= ${finalPartBStep}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function genLevelThreeIII() {
      const a = rand(2, 10);

      let b = rand(-10, 10);
      while (b === 0 || b === 1 || b === -1) {
        b = rand(-10, 10);
      }

      let c = rand(-10, 10);
      while (c === 0 || c === 1 || c === -1) {
        c = rand(-10, 10);
      }

      const g = gcd(a, b);
      const ar = a / g;
      const br = b / g;

      const one =
        `${a * a}x^{2}` +
        `${variableTerm(2 * a * b, 'xy')}` +
        `${variableTerm(b * b, 'y^{2}')}`;

      const two =
        `${one}` +
        `${variableTerm(c * a, 'x')}` +
        `${variableTerm(c * b, 'y')}`;

      const answerOne =
        g === 1
          ? `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})^{2}`
          : `${g * g}(${leadingVariableTerm(ar, 'x')}${variableTerm(br, 'y')})^{2}`;

      const answerTwo =
        `${g}` +
        `(${leadingVariableTerm(ar, 'x')}${variableTerm(br, 'y')})` +
        `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')}${constantTerm(c)})`;

      const q =
        `\\text{(a) }${one}` +
        `\\qquad` +
        `\\text{(b) }${two}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${one} &= ${answerOne}\\\\` +
        `\\text{(b) }${two} ` +
        `&= ${g}(${leadingVariableTerm(ar, 'x')}${variableTerm(br, 'y')})` +
        `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')}${constantTerm(c)})\\\\` +
        `&= ${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function genLevelThreeIV() {
      const a = rand(3, 10);
      const b = -rand(5, 20);
      const sign = rand(0, 1) === 0 ? -1 : 1;

      const sum = a + b;
      const product = a * b;

      const one =
        `x^{2}` +
        `${variableTerm(sum, 'x')}` +
        `${constantTerm(product)}`;

      const two =
        `${one}` +
        `${variableTerm(sign, 'kx')}` +
        `${variableTerm(sign * a, 'k')}`;

      const answerOne =
        `(x${constantTerm(a)})` +
        `(x${constantTerm(b)})`;

      const answerTwo =
        `(x${constantTerm(a)})` +
        `(x${constantTerm(b)}${variableTerm(sign, 'k')})`;

      const q =
        `\\text{(a) }${one}` +
        `\\qquad` +
        `\\text{(b) }${two}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${one} &= ${answerOne}\\\\` +
        `\\text{(b) }${two} ` +
        `&= (x${constantTerm(a)})(x${constantTerm(b)})` +
        `${variableTerm(sign, 'k')}(x${constantTerm(a)})\\\\` +
        `&= ${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function genLevelThreeV() {
      const a = rand(2, 10);

      let b = rand(-10, 10);
      while (b === 0) {
        b = rand(-10, 10);
      }

      const c = rand(2, 10);

      let d = rand(-10, 10);
      while (d === 0) {
        d = rand(-10, 10);
      }

      const w = rand(1, 4);
      const signOne = rand(0, 1) === 0 ? -1 : 1;
      const signTwo = rand(0, 1) === 0 ? -1 : 1;

      const middle = a * d + b * c;

      const one =
        `${leadingVariableTerm(a * c, 'x^{2}')}` +
        `${variableTerm(middle, 'xy')}` +
        `${variableTerm(b * d, 'y^{2}')}`;

      const two =
        `${leadingVariableTerm(w * signOne * c, 'mx')}` +
        `${variableTerm(w * signOne * d, 'my')}` +
        `${variableTerm(signTwo * a * c, 'x^{2}')}` +
        `${variableTerm(signTwo * middle, 'xy')}` +
        `${variableTerm(signTwo * b * d, 'y^{2}')}`;

      const answerOne =
        `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})` +
        `(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'y')})`;

      const inner =
        `${leadingVariableTerm(w * signOne, 'm')}` +
        `${variableTerm(signTwo * a, 'x')}` +
        `${variableTerm(signTwo * b, 'y')}`;

      const answerTwo =
        `(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'y')})` +
        `(${inner})`;

      const q =
        `\\text{(a) }${one}` +
        `\\qquad` +
        `\\text{(b) }${two}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${one} &= ${answerOne}\\\\` +
        `\\text{(b) }${two} ` +
        `&= (${leadingVariableTerm(c, 'x')}${variableTerm(d, 'y')})` +
        `(${inner})\\\\` +
        `&= ${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function genLevelThreeVI() {
      const a = rand(2, 7);
      const sign = rand(0, 1) === 0 ? -1 : 1;
      const c = rand(8, 12);

      let d = rand(-10, 5);
      while (d === 0) {
        d = rand(-10, 5);
      }

      const squareOne =
        `${a * a}x^{2}` +
        `${variableTerm(2 * sign * a, 'x')}` +
        `${constantTerm(1)}`;

      const linearOne =
        `${leadingVariableTerm(a, 'x')}` +
        `${constantTerm(sign)}`;

      const firstSquare =
        `(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')})^{2}`;

      const two =
        `${firstSquare}-(${linearOne})^{2}`;

      const answerOne = `(${linearOne})^{2}`;

      const factorOne =
        `(${leadingVariableTerm(c + a, 'x')}` +
        `${variableTerm(d, 'm')}` +
        `${constantTerm(sign)})`;

      const factorTwo =
        `(${leadingVariableTerm(c - a, 'x')}` +
        `${variableTerm(d, 'm')}` +
        `${constantTerm(-sign)})`;

      const answerTwo = `${factorOne}${factorTwo}`;

      const q =
        `\\text{(a) }${squareOne}` +
        `\\qquad` +
        `\\text{(b) }${two}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${squareOne} &= ${answerOne}\\\\` +
        `\\text{(b) }${two} ` +
        `&= (${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')}+${linearOne})` +
        `(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')}-${linearOne})\\\\` +
        `&= ${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }


    function makeLevel(level) {
      const groups = [
        [genCommonMN, genCommonBinomial, genOppositeFactor, genCommonBinomialSquare, genGroupingK, genGroupingXYZ, genGroupingABC],
        [genPerfectSquare, genDifferenceSquares, genTrinomial, genGeneralQuadratic],
        [genLevelThreeI, genLevelThreeII, genLevelThreeIII, genLevelThreeIV, genLevelThreeV, genLevelThreeVI]
      ];
      const list = groups[level - 1];
      return list[rand(0, list.length - 1)]();
    }

    function startQuestion(level) {
      currentQuestion = makeLevel(level);
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('practice').classList.remove('hidden');
      document.getElementById('levelTitle').textContent = `Level ${['One', 'Two', 'Three'][level - 1]} Factorization`;
      const q = document.getElementById('questionDisplay');
      q.value = currentQuestion.questionTex;
      document.getElementById('answers').innerHTML = '';
      activeField = null;
      currentQuestion.answers.forEach((_, i) => {
        const holder = document.getElementById('answers');
        if (currentQuestion.answers.length > 1) {
          const label = document.createElement('p');
          label.className = 'mb-1 text-center font-bold';
          label.textContent = i === 0 ? '(a)' : '(b)';
          holder.appendChild(label);
        }
        const field = document.createElement('math-field');
        field.id = `answer-${i}`;
        field.className = 'answer-math';
        field.setAttribute('math-virtual-keyboard-policy', 'manual');
        field.addEventListener('focusin', () => activeField = field);
        field.addEventListener('pointerdown', () => activeField = field);
        holder.appendChild(field);
        if (i === 0) activeField = field;
      });
      initCanvas();
      resizeCanvas();
      clearScratchpad();
      setTimeout(() => activeField && activeField.focus(), 120);
    }

    function insertMath(value) {
      const field = activeField || document.getElementById('answer-0');
      if (!field) return;
      field.focus();
      try {
        field.insert(value);
      } catch (error) {
        try { field.executeCommand(['insert', value]); } catch (fallbackError) { console.error(fallbackError); }
      }
    }

    function cmdMath(command) {
      const field = activeField || document.getElementById('answer-0');
      if (!field) return;
      field.focus();
      try { field.executeCommand(command); } catch (error) { console.error(error); }
    }

    window.insertMath = insertMath;
    window.cmdMath = cmdMath;
    window.startQuestion = startQuestion;

    function clean(latex) {
      return (latex || '')
        .replace(/\\left|\\right|\\mleft|\\mright|\\,/g, '')
        .replace(/\\cdot/g, '*')
        .replace(/\s+/g, '')
        .replace(/[−–—]/g, '-');
    }

    function toMathJs(latex) {
      let s = clean(latex)
        .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1)/($2)')
        .replace(/\{([^{}]*)\}/g, '($1)')
        .replace(/\^\(([^()]*)\)/g, '^($1)')
        .replace(/\^([0-9]+)/g, '^$1');
      return s
        .replace(/([0-9xyabcmnkz])([xyabcmnkz(])/g, '$1*$2')
        .replace(/\)\(/g, ')*(');
    }

    function equivalent(student, expected) {
      try {
        const a = math.parse(toMathJs(student));
        const b = math.parse(toMathJs(expected));
        const tests = [
          { x:2, y:3, z:5, a:7, b:11, c:13, m:17, n:19, k:23 },
          { x:-2, y:5, z:3, a:2, b:-4, c:7, m:11, n:-3, k:5 },
          { x:4, y:-3, z:2, a:-2, b:5, c:7, m:-5, n:2, k:-3 }
        ];
        return tests.every(scope => Math.abs(a.evaluate(scope) - b.evaluate(scope)) < 1e-8);
      } catch (error) {
        return false;
      }
    }

    function looksFactorised(latex) {
      const s = clean(latex);
      return s.includes('(') || s.includes('^2');
    }

    function checkAnswer() {
      if (!currentQuestion) return;
      const correct = currentQuestion.answers.every((answer, i) => {
        const field = document.getElementById(`answer-${i}`);
        const value = field ? field.value : '';
        return value.trim() && looksFactorised(value) && equivalent(value, answer);
      });
      const feedback = document.getElementById('feedback');
      const title = document.getElementById('feedbackTitle');
      const text = document.getElementById('feedbackText');
      const solutionWrap = document.getElementById('solutionWrap');
      const continueButton = document.getElementById('continueBtn');
      if (correct) {
        title.textContent = 'Correct!';
        title.style.color = '#137a4a';
        text.textContent = 'Well done. Returning to the home page…';
        solutionWrap.classList.add('hidden');
        continueButton.classList.add('hidden');
        feedback.classList.remove('hidden');
        setTimeout(() => { feedback.classList.add('hidden'); backToMenu(); }, 850);
      } else {
        title.textContent = 'Not quite';
        title.style.color = '#b42318';
        text.textContent = 'Review the solution, then continue to try this same question again.';
        document.getElementById('solutionDisplay').value = currentQuestion.solutionTex;
        solutionWrap.classList.remove('hidden');
        continueButton.classList.remove('hidden');
        feedback.classList.remove('hidden');
      }
    }

    function closeFeedback() {
      document.getElementById('feedback').classList.add('hidden');
      setTimeout(() => activeField && activeField.focus(), 80);
    }

    function backToMenu() {
      document.getElementById('practice').classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    }

    function initCanvas() {
      canvas = document.getElementById('scratchpad');
      if (!canvas || canvas.dataset.ready) return;
      ctx = canvas.getContext('2d');
      canvas.dataset.ready = '1';
      ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerleave'].forEach(type => canvas.addEventListener(type, draw));
      window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
      if (!canvas || !ctx) return;
      const old = document.createElement('canvas');
      old.width = canvas.width;
      old.height = canvas.height;
      if (old.width) old.getContext('2d').drawImage(canvas, 0, 0);
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.strokeStyle = '#1876c9';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (old.width) ctx.drawImage(old, 0, 0);
    }

    function draw(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (event.type === 'pointerdown') {
        drawing = true;
        canvas.setPointerCapture && canvas.setPointerCapture(event.pointerId);
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else if (event.type === 'pointermove' && drawing) {
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        drawing = false;
        ctx.beginPath();
      }
      event.preventDefault();
    }

    function clearScratchpad() {
      if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.checkAnswer = checkAnswer;
    window.closeFeedback = closeFeedback;
    window.backToMenu = backToMenu;
    window.clearScratchpad = clearScratchpad;
  </script>
</body>
