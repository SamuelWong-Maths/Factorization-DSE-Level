<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Daily Maths Practice: Factorisation</title>
  <!-- KaTeX for crystal-clear, rock-solid math rendering without script errors -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <!-- MathLive for interactive student input & virtual keyboard -->
  <script src="https://unpkg.com/mathlive"></script>
  <!-- MathJS for intelligent algebraic equivalence checking -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ink: #18344f;
      --blue: #1769aa;
      --green: #39a96b;
      --amber: #dda20a;
      --purple: #79bfe8;
      --bg: #edf4f8;
      --line: #c8d8e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: #1f2937;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .panel {
      width: min(1280px, 100%);
      padding: 24px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 32px rgba(23, 50, 77, 0.12);
    }
    .hidden { display: none !important; }
    button {
      border: 0;
      border-radius: 10px;
      color: #fff;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:active { transform: scale(0.97); }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    .level {
      min-height: 120px;
      font-size: 1.18rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
    }
    .one { background: var(--green); }
    .two { background: var(--amber); color: #2c2100; }
    .three { background: var(--purple); }

    /* 2-column layout with generous left-column width for math expressions */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1.15fr);
      gap: 24px;
      align-items: stretch;
    }
    .left-col {
      display: flex;
      flex-direction: column;
    }
    .right-col {
      display: flex;
      flex-direction: column;
    }
    .question-math {
      width: 100%;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      text-align: left;
      overflow-x: auto;
      padding: 8px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .answer-math {
      width: 100%;
      max-width: 540px;
      min-height: 56px;
      display: block;
      margin: 6px auto 10px;
      padding: 8px 12px;
      border: 2px solid var(--line);
      border-radius: 10px;
      font-size: 1.45rem;
      background: #fff;
    }
    .answer-math:focus-within {
      border-color: var(--blue);
      outline: none;
    }
    math-field::part(menu-toggle),
    math-field::part(virtual-keyboard-toggle) {
      display: none;
    }
    .keyboard {
      width: 100%;
      max-width: 540px;
      margin: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f2f7fb;
    }
    .key-row {
      display: grid;
      gap: 6px;
      margin: 6px 0;
    }
    .variables { grid-template-columns: repeat(7, 1fr); }
    .numbers { grid-template-columns: repeat(10, 1fr); }
    .operators { grid-template-columns: repeat(7, 1fr); }
    .key {
      min-height: 48px;
      padding: 4px 2px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #bcd0dd;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 2px 0 #bcd0dd;
    }
    .key:active {
      box-shadow: none;
      transform: translateY(2px);
    }
    .key.special { background: #dceefa; color: #075c9e; border-color: #a9d4f2; }
    .key.delete { background: #ffe5e5; color: #a11; border-color: #f5b8b8; }
    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
    }
    .check { background: #39a96b; }

    .back { background: #8796aa; }

    .clear {
      display: block;
      margin: 10px auto 0;
      background: #e06b65;
    }
    .check, .back, .clear, .continue {
      min-width: 170px;
      min-height: 52px;
      padding: 12px 24px;
      font-size: 1.12rem;
      line-height: 1.2;
      white-space: nowrap;
    }
    .clear {
      min-width: 200px;
    }

    /* Large Scratchpad designed for iPad touch/pencil */
    .scratch-wrap {
      flex: 1;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px dashed #a5bccc;
      border-radius: 14px;
      background: #fbfdff;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
    }
    .modal-box {
      width: min(740px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    .solution-wrap {
      margin: 16px 0;
      padding: 14px;
      overflow-x: auto;
      text-align: left;
      border-left: 5px solid #c2413a;
      border-radius: 8px;
      background: #f5f9fc;
    }
    .solution-math {
      width: 100%;
      min-height: 40px;
      font-size: 1.15rem;
    }

    /* iPad Portrait & Mobile */
    @media (max-width: 900px) {
      .app { padding: 10px; align-items: flex-start; }
      .panel { padding: 16px; }
      .layout { grid-template-columns: 1fr; gap: 18px; }
      .level-grid { gap: 10px; }
      .level { min-height: 90px; font-size: 1rem; }
      .scratch-wrap, canvas { min-height: 380px; }
      .check, .back, .clear, .continue { min-width: 140px; min-height: 48px; font-size: 1rem; padding: 10px 18px; }
    }

    /* iPad Landscape / Tablets */
    @media (min-width: 901px) and (max-height: 900px) {
      .app { padding: 12px; }
      .panel { padding: 18px; }
      .layout { gap: 20px; }
      .scratch-wrap, canvas { min-height: 460px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="menu" class="panel text-center">
      <h1 class="m-0 text-6xl font-extrabold text-slate-800 tracking-tight">Factorization</h1>
      <p class="mt-3 text-lg text-slate-600">Choose a level to begin practising.</p>
      <div class="level-grid">
        <button class="level one" onclick="startQuestion(1)">Level One (S2)</button>
        <button class="level two" onclick="startQuestion(2)">Level Two (S3)</button>
        <button class="level three" onclick="startQuestion(3)">Level Three (S3 or above)</button>
      </div>
    </section>

    <section id="practice" class="panel hidden">
      <h2 id="levelTitle" class="m-0 mb-2 text-center text-2xl font-bold text-slate-800"></h2>
      <div class="layout">
        <div class="left-col">
          <div id="questionDisplay" class="question-math"></div>
          <p class="my-1 text-center text-sm font-medium text-slate-500">Enter the expression in fully factorized form.</p>
          <div id="answers"></div>
          <div class="keyboard">
            <div class="key-row variables">
              <button type="button" class="key" onclick="insertMath('x')">x</button><button type="button" class="key" onclick="insertMath('y')">y</button><button type="button" class="key" onclick="insertMath('a')">a</button><button type="button" class="key" onclick="insertMath('b')">b</button><button type="button" class="key" onclick="insertMath('c')">c</button><button type="button" class="key" onclick="insertMath('m')">m</button><button type="button" class="key" onclick="insertMath('n')">n</button>
            </div>
            <div class="key-row numbers">
              <button type="button" class="key" onclick="insertMath('0')">0</button><button type="button" class="key" onclick="insertMath('1')">1</button><button type="button" class="key" onclick="insertMath('2')">2</button><button type="button" class="key" onclick="insertMath('3')">3</button><button type="button" class="key" onclick="insertMath('4')">4</button><button type="button" class="key" onclick="insertMath('5')">5</button><button type="button" class="key" onclick="insertMath('6')">6</button><button type="button" class="key" onclick="insertMath('7')">7</button><button type="button" class="key" onclick="insertMath('8')">8</button><button type="button" class="key" onclick="insertMath('9')">9</button>
            </div>
            <div class="key-row operators">
              <button type="button" class="key special" onclick="insertMath('(')">(</button><button type="button" class="key special" onclick="insertMath(')')">)</button><button type="button" class="key special" onclick="insertMath('+')">+</button><button type="button" class="key special" onclick="insertMath('-')">−</button><button type="button" class="key special" onclick="insertMath('^{#?}')">□²</button><button type="button" class="key special" onclick="cmdMath('moveToPreviousChar')">◀</button><button type="button" class="key delete" onclick="cmdMath('deleteBackward')">⌫</button>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="check" onclick="checkAnswer()">Check answer</button>
            <button type="button" class="back" onclick="backToMenu()">Back</button>
          </div>
        </div>
        <div class="right-col">
          <div class="flex items-center justify-between mb-1 px-1">
            <span class="font-bold text-slate-600 text-sm tracking-wide uppercase">Scratchpad</span>
            <span class="text-xs text-slate-400">Pencil / Finger draft</span>
          </div>
          <div class="scratch-wrap">
            <canvas id="scratchpad"></canvas>
          </div>
          <button type="button" class="clear" onclick="clearScratchpad()">Clear scratchpad</button>
        </div>
      </div>
    </section>
  </main>

  <div id="feedback" class="modal hidden">
    <div class="modal-box">
      <h2 id="feedbackTitle" class="text-2xl font-bold mb-2"></h2>
      <p id="feedbackText" class="text-slate-700 text-base mb-3"></p>
      <div id="solutionWrap" class="solution-wrap hidden">
        <div id="solutionDisplay" class="solution-math"></div>
      </div>
      <button type="button" id="continueBtn" class="continue" onclick="closeFeedback()">Continue</button>
    </div>
  </div>

  <script>
    let currentQuestion = null;
    let activeField = null;
    let canvas = null, ctx = null, drawing = false;

    let mathLiveReady = false;

    async function waitForMathLive() {
      try {
        if (window.customElements && customElements.whenDefined) {
          await customElements.whenDefined('math-field');
        }
        mathLiveReady = true;
      } catch (error) {
        console.error('MathLive failed to initialise:', error);
      }
    }

    const rand = (min, max, excludes = []) => {
      let v;
      let count = 0;
      do {
        v = Math.floor(Math.random() * (max - min + 1)) + min;
        count++;
      } while (excludes.includes(v) && count < 100);
      return v;
    };

    const gcd = (a, b) => {
      a = Math.abs(a || 0);
      b = Math.abs(b || 0);
      while (b) [a, b] = [b, a % b];
      return a || 1;
    };

    const leadingCoefficient = n => n === 1 ? '' : n === -1 ? '-' : String(n);
    const signedCoefficient = n => n === 1 ? '+' : n === -1 ? '-' : n > 0 ? `+${n}` : String(n);
    const constantTerm = (n, first = false) => n === 0 ? '' : first ? String(n) : n > 0 ? `+${n}` : String(n);
    const variableTerm = (n, letters, first = false) => n === 0 ? '' : first ? `${leadingCoefficient(n)}${letters}` : `${signedCoefficient(n)}${letters}`;
    const leadingVariableTerm = (n, letters) => variableTerm(n, letters, true);
    const binomial = (a, v, b, w) => `(${variableTerm(a, v, true)}${variableTerm(b, w)})`;
    const makeQuestion = (questionTex, answers, solutionTex) => ({ questionTex, answers, solutionTex });

    /* ===== LEVEL ONE GENERATORS ===== */
    function genCommonMN() {
      const outer = rand(2, 8), b = rand(2, 9), c = rand(2, 9), d = rand(2, 9);
      const innerGcd = gcd(gcd(b, c), d);
      const finalOuter = outer * innerGcd;
      const q = `${variableTerm(outer * b, 'm^{2}n^{2}', true)}${variableTerm(-outer * c, 'm^{2}n')}${variableTerm(-outer * d, 'mn^{2}')}`;
      const mid = `${outer}mn(${variableTerm(b, 'mn', true)}${variableTerm(-c, 'm')}${variableTerm(-d, 'n')})`;
      const answer = innerGcd === 1 ? mid : `${finalOuter}mn(${variableTerm(b / innerGcd, 'mn', true)}${variableTerm(-c / innerGcd, 'm')}${variableTerm(-d / innerGcd, 'n')})`;
      const sol = innerGcd === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genCommonBinomial() {
      const a = rand(2, 10), b = rand(2, 10), s = a + b;
      const q = `(x-${a})(x+y)-${b}(x+y)`;
      const answer = `(x+y)(x-${s})`;
      return makeQuestion(q, [answer], `\\begin{aligned}${q}&=(x+y)[(x-${a})-${b}]\\\\&=${answer}\\end{aligned}`);
    }

    function genOppositeFactor() {
      const a = rand(10, 20), b = rand(2, 9);
      const q = `${a}(x-${b})+x(${b}-x)`;
      const answer = `(x-${b})(${a}-x)`;
      return makeQuestion(q, [answer], `\\begin{aligned}${q}&=${a}(x-${b})-x(x-${b})\\\\&=${answer}\\end{aligned}`);
    }

    function genCommonBinomialSquare() {
      let a, b, c, d, x, y, g1, g2;
      let tries = 0;
      do {
        a = rand(6, 12); b = rand(6, 12); c = rand(2, 5); d = rand(2, 5);
        x = a - c; y = b - d; g1 = gcd(a, b); g2 = gcd(x, y);
        tries++;
      } while (a / g1 === x / g2 && b / g1 === y / g2 && tries < 30);

      const f = `(${variableTerm(a, 'x', true)}${variableTerm(b, 'y')})`;
      const h = `(${variableTerm(c, 'x', true)}${variableTerm(d, 'y')})`;
      const mid = `${f}(${variableTerm(x, 'x', true)}${variableTerm(y, 'y')})`;
      const g = g1 * g2;
      const answer = g === 1 ? mid : `${g}(${variableTerm(a / g1, 'x', true)}${variableTerm(b / g1, 'y')})(${variableTerm(x / g2, 'x', true)}${variableTerm(y / g2, 'y')})`;
      const q = `${f}^{2}-${f}${h}`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${f}[${f}-${h}]\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingK() {
      const a = rand(2, 10), b = rand(2, 10), g = gcd(a, b);
      const q = `${variableTerm(a, 'x^{3}', true)}${variableTerm(-a, 'x^{2}')}${variableTerm(b, 'ax^{2}')}${variableTerm(-b, 'ax')}`;
      const mid = `x(x-1)(${variableTerm(a, 'x', true)}${variableTerm(b, 'a')})`;
      const answer = g === 1 ? mid : `${g}x(x-1)(${variableTerm(a / g, 'x', true)}${variableTerm(b / g, 'a')})`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'x^{2}', true)}(x-1)+${variableTerm(b, 'ax', true)}(x-1)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'x^{2}', true)}(x-1)+${variableTerm(b, 'ax', true)}(x-1)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingXYZ() {
      const a = rand(2, 10), b = rand(2, 10), g = gcd(a, b);
      const q = `${variableTerm(a, 'x^{2}', true)}${variableTerm(a, 'xy')}${variableTerm(a, 'xz')}${variableTerm(-b, 'x')}${variableTerm(-b, 'y')}${variableTerm(-b, 'z')}`;
      const mid = `(${variableTerm(a, 'x', true)}-${b})(x+y+z)`;
      const answer = g === 1 ? mid : `${g}(${variableTerm(a / g, 'x', true)}-${b / g})(x+y+z)`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'x', true)}(x+y+z)-${b}(x+y+z)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'x', true)}(x+y+z)-${b}(x+y+z)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    function genGroupingABC() {
      const a = rand(8, 20), b = rand(2, 7), g = gcd(a, b);
      const q = `${variableTerm(a, 'a', true)}${variableTerm(-b, 'bc')}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}`;
      const mid = `(a-b)(${constantTerm(a, true)}${variableTerm(b, 'c')})`;
      const answer = g === 1 ? mid : `${g}(a-b)(${constantTerm(a / g, true)}${variableTerm(b / g, 'c')})`;
      const sol = g === 1 ? `\\begin{aligned}${q}&=${variableTerm(a, 'a', true)}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}${variableTerm(-b, 'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${answer}\\end{aligned}` : `\\begin{aligned}${q}&=${variableTerm(a, 'a', true)}${variableTerm(-a, 'b')}${variableTerm(b, 'ac')}${variableTerm(-b, 'bc')}\\\\&=${a}(a-b)+${b}c(a-b)\\\\&=${mid}\\\\&=${answer}\\end{aligned}`;
      return makeQuestion(q, [answer], sol);
    }

    /* ===== LEVEL TWO GENERATORS ===== */
    function genPerfectSquare() {
      let a = rand(-10, 10, [0, 1, -1]);
      const q = `x^{2}${variableTerm(2 * a, 'xy')}${variableTerm(a * a, 'y^{2}')}`;
      const answer = `(x${variableTerm(a, 'y')})^{2}`;
      return makeQuestion(q, [answer], `${q}=${answer}`);
    }

    function genDifferenceSquares() {
      const a = rand(2, 15), b = rand(2, 15), g = gcd(a, b);
      const q = `${a * a}x^{2}-${b * b}y^{2}`;
      const mid = `(${a}x+${b}y)(${a}x-${b}y)`;
      const answer = g === 1 ? mid : `${g * g}(${a / g}x+${b / g}y)(${a / g}x-${b / g}y)`;
      return makeQuestion(q, [answer], g === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`);
    }

    function genTrinomial() {
      const a = rand(3, 10), b = -rand(5, 20), s = a + b, p = a * b;
      const q = `x^{2}${variableTerm(s, 'x')}${constantTerm(p)}`;
      const answer = `(x${constantTerm(a)})(x${constantTerm(b)})`;
      return makeQuestion(q, [answer], `${q}=${answer}`);
    }

    function genGeneralQuadratic() {
      let a = rand(2, 10), b = rand(-10, 10, [0]), c = rand(2, 10), d = rand(-10, 10, [0]);
      const s = a * d + b * c, g1 = gcd(a, b), g2 = gcd(c, d), g = g1 * g2;
      const q = `${variableTerm(a * c, 'x^{2}', true)}${variableTerm(s, 'xy')}${variableTerm(b * d, 'y^{2}')}`;
      const mid = `${binomial(a, 'x', b, 'y')}${binomial(c, 'x', d, 'y')}`;
      const answer = g === 1 ? mid : `${g}${binomial(a / g1, 'x', b / g1, 'y')}${binomial(c / g2, 'x', d / g2, 'y')}`;
      return makeQuestion(q, [answer], g === 1 ? `${q}=${answer}` : `\\begin{aligned}${q}&=${mid}\\\\&=${answer}\\end{aligned}`);
    }

    /* ===== LEVEL THREE GENERATORS (Left-aligned & strictly extract all common factors at final step) ===== */
    function genLevelThreeI() {
      let a = rand(-10, 10, [0, 1, -1]);
      let c = rand(-10, 10, [0, 1, -1]);
      const one = `x^{2}${variableTerm(2 * a, 'xy')}${variableTerm(a * a, 'y^{2}')}`;
      const two = `${one}${variableTerm(c, 'x')}${variableTerm(a * c, 'y')}`;
      const answerOne = `(x${variableTerm(a, 'y')})^{2}`;
      const answerTwo = `(x${variableTerm(a, 'y')})(x${variableTerm(a, 'y')}${constantTerm(c)})`;
      const q = `\\begin{aligned}&\\text{(a) }${one}\\\\[4pt]&\\text{(b) }${two}\\end{aligned}`;
      const sol = `\\begin{aligned}\\text{(a) }${one}&=${answerOne}\\\\\\text{(b) }${two}&=(x${variableTerm(a, 'y')})^{2}${constantTerm(c)}(x${variableTerm(a, 'y')})\\\\&=${answerTwo}\\end{aligned}`;
      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function genLevelThreeII() {
      const a = rand(2, 15), b = rand(2, 15);
      let c = rand(-10, 10, [0, 1, -1]);
      const g = gcd(a, b);
      const u = a / g, v = b / g;
      const D = g * g;
      const E = c * g;
      const X = gcd(D, Math.abs(E)); // Overall common factor extracted at final step
      const k = X / g; // gcd(g, |c|)

      const qOne = `${a * a}x^{2}-${b * b}y^{2}`;
      const qTwo = `${qOne}${variableTerm(c * a, 'x')}${variableTerm(c * b, 'y')}`;

      const answerOne = g === 1 ? `(${a}x+${b}y)(${a}x-${b}y)` : `${g * g}(${u}x+${v}y)(${u}x-${v}y)`;
      
      const secondTerm = `${leadingVariableTerm((g / k) * u, 'x')}${variableTerm(-(g / k) * v, 'y')}${constantTerm(c / k)}`;
      const answerTwo = X === 1
        ? `(${u}x+${v}y)(${secondTerm})`
        : `${X}(${u}x+${v}y)(${secondTerm})`;

      const q = `\\begin{aligned}&\\text{(a) }${qOne}\\\\[4pt]&\\text{(b) }${qTwo}\\end{aligned}`;
      const partBFirstStep = `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})(${leadingVariableTerm(a, 'x')}${variableTerm(-b, 'y')})${constantTerm(c)}(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})`;
      const partBMidStep = `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})(${leadingVariableTerm(a, 'x')}${variableTerm(-b, 'y')}${constantTerm(c)})`;
      const sol = `\\begin{aligned}\\text{(a) }${qOne}&=${answerOne}\\\\\\text{(b) }${qTwo}&=${partBFirstStep}\\\\&=(${partBMidStep})\\\\&=${answerTwo}\\end{aligned}`;
      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function genLevelThreeIII() {
      const a = rand(2, 10);

      let b = rand(-10, 10, [0, 1, -1]);
      let c = rand(-10, 10, [0, 1, -1]);

      const g = gcd(a, Math.abs(b));
      const ar = a / g;
      const br = b / g;

      /*
        k is the common factor between g and c.

        Example:
        16x^2 + 32xy + 16y^2 + 20x + 20y

        g = 4, c = 5, k = 1

        = 4(x+y)[4(x+y)+5]
        = 4(x+y)(4x+4y+5)
      */
      const k = gcd(g, Math.abs(c));
      const finalOuter = g * k;

      const one =
        `${a * a}x^{2}` +
        `${variableTerm(2 * a * b, 'xy')}` +
        `${variableTerm(b * b, 'y^{2}')}`;

      const two =
        `${one}` +
        `${variableTerm(c * a, 'x')}` +
        `${variableTerm(c * b, 'y')}`;

      const primitiveFactor =
        `(${leadingVariableTerm(ar, 'x')}` +
        `${variableTerm(br, 'y')})`;

      const fullFactor =
        `(${leadingVariableTerm(a, 'x')}` +
        `${variableTerm(b, 'y')})`;

      const answerOne =
        g === 1
          ? `${fullFactor}^{2}`
          : `${g * g}${primitiveFactor}^{2}`;

      /*
        Do not display an unnecessary coefficient 1.

        If finalOuter = 1:
        (5x-2y)(5x-2y-4)

        If finalOuter = 4:
        4(x+y)(4x+4y+5)
      */
      const finalBracket =
        `(${leadingVariableTerm(a / k, 'x')}` +
        `${variableTerm(b / k, 'y')}` +
        `${constantTerm(c / k)})`;

      const answerTwo =
        finalOuter === 1
          ? `${primitiveFactor}${finalBracket}`
          : `${finalOuter}${primitiveFactor}${finalBracket}`;

      const q =
        `\\begin{aligned}` +
        `\\text{(a) }&${one}\\\\[6pt]` +
        `\\text{(b) }&${two}` +
        `\\end{aligned}`;

      /*
        The new terms are explicitly factorised first.

        For example:
        -20x+8y = -4(5x-2y)
      */
      const newTermCoefficient = c * g;

      const partBLineOne =
        `${g * g}${primitiveFactor}^{2}` +
        `${signedCoefficient(newTermCoefficient)}${primitiveFactor}`;

      const firstCommonFactor =
        g === 1
          ? primitiveFactor
          : `${g}${primitiveFactor}`;

      const groupedBracket =
        `\\left[` +
        `${leadingVariableTerm(a, 'x')}` +
        `${variableTerm(b, 'y')}` +
        `${constantTerm(c)}` +
        `\\right]`;

      const partBLineTwo =
        `${firstCommonFactor}${groupedBracket}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${one}` +
        `&=${answerOne}\\\\[6pt]` +
        `\\text{(b) }${two}` +
        `&=${partBLineOne}\\\\` +
        `&=${partBLineTwo}\\\\` +
        `&=${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function genLevelThreeIV() {
      const a = rand(3, 10), b = -rand(5, 20);
      const sign = rand(0, 1) === 0 ? -1 : 1;
      const sum = a + b, product = a * b;

      const one = `x^{2}${variableTerm(sum, 'x')}${constantTerm(product)}`;
      const two = `${one}${variableTerm(sign, 'kx')}${variableTerm(sign * a, 'k')}`;

      const answerOne = `(x${constantTerm(a)})(x${constantTerm(b)})`;
      const answerTwo = `(x${constantTerm(a)})(x${constantTerm(b)}${variableTerm(sign, 'k')})`;

      const q = `\\begin{aligned}&\\text{(a) }${one}\\\\[4pt]&\\text{(b) }${two}\\end{aligned}`;
      const sol = `\\begin{aligned}\\text{(a) }${one}&=${answerOne}\\\\\\text{(b) }${two}&=(x${constantTerm(a)})(x${constantTerm(b)})${variableTerm(sign, 'k')}(x${constantTerm(a)})\\\\&=${answerTwo}\\end{aligned}`;
      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function genLevelThreeV() {
      let a = rand(2, 10), b = rand(-10, 10, [0]);
      let c = rand(2, 10), d = rand(-10, 10, [0]);
      const w = rand(1, 4), signOne = rand(0, 1) === 0 ? -1 : 1, signTwo = rand(0, 1) === 0 ? -1 : 1;
      const middle = a * d + b * c;

      const g1 = gcd(a, Math.abs(b));
      const g2 = gcd(c, Math.abs(d));
      const gTotal = g1 * g2;

      const one = `${leadingVariableTerm(a * c, 'x^{2}')}${variableTerm(middle, 'xy')}${variableTerm(b * d, 'y^{2}')}`;
      const two = `${leadingVariableTerm(w * signOne * c, 'mx')}${variableTerm(w * signOne * d, 'my')}${variableTerm(signTwo * a * c, 'x^{2}')}${variableTerm(signTwo * middle, 'xy')}${variableTerm(signTwo * b * d, 'y^{2}')}`;

      const answerOne = gTotal === 1
        ? `(${leadingVariableTerm(a, 'x')}${variableTerm(b, 'y')})(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'y')})`
        : `${gTotal}(${leadingVariableTerm(a / g1, 'x')}${variableTerm(b / g1, 'y')})(${leadingVariableTerm(c / g2, 'x')}${variableTerm(d / g2, 'y')})`;

      const innerCoeffM = w * signOne;
      const innerCoeffX = signTwo * a;
      const innerCoeffY = signTwo * b;
      const innerG = gcd(gcd(Math.abs(innerCoeffM), Math.abs(innerCoeffX)), Math.abs(innerCoeffY));
      const finalOuter = g2 * innerG;

      const factorC = `(${leadingVariableTerm(c / g2, 'x')}${variableTerm(d / g2, 'y')})`;
      const inner = `${leadingVariableTerm(innerCoeffM / innerG, 'm')}${variableTerm(innerCoeffX / innerG, 'x')}${variableTerm(innerCoeffY / innerG, 'y')}`;
      const answerTwo = finalOuter === 1 ? `${factorC}(${inner})` : `${finalOuter}${factorC}(${inner})`;

      const q = `\\begin{aligned}&\\text{(a) }${one}\\\\[4pt]&\\text{(b) }${two}\\end{aligned}`;
      const sol = `\\begin{aligned}\\text{(a) }${one}&=${answerOne}\\\\\\text{(b) }${two}&=(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'y')})(${leadingVariableTerm(innerCoeffM, 'm')}${variableTerm(innerCoeffX, 'x')}${variableTerm(innerCoeffY, 'y')})\\\\&=${answerTwo}\\end{aligned}`;
      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function genLevelThreeVI() {
      const a = rand(2, 7);
      const sign = rand(0, 1) === 0 ? -1 : 1;
      const c = rand(8, 12);

      let d = rand(-10, 5, [0]);
      while (gcd(c, Math.abs(d)) !== 1) {
        d = rand(-10, 5, [0]);
      }

      /*
        Part (a):
        a^2x^2 + 2(sign)ax + 1
        = (ax + sign)^2
      */
      const squareOne =
        `${a * a}x^{2}` +
        `${variableTerm(2 * sign * a, 'x')}` +
        `${constantTerm(1)}`;

      const linearOne =
        `${leadingVariableTerm(a, 'x')}` +
        `${constantTerm(sign)}`;

      const answerOne = `(${linearOne})^{2}`;

      /*
        Part (b) uses the expanded negative of part (a).

        Example:
        (10x-3m)^2 - 4x^2 - 4x - 1
      */
      const firstSquare =
        `(${leadingVariableTerm(c, 'x')}` +
        `${variableTerm(d, 'm')})^{2}`;

      const two =
        `${firstSquare}` +
        `${variableTerm(-(a * a), 'x^{2}')}` +
        `${variableTerm(-2 * sign * a, 'x')}` +
        `${constantTerm(-1)}`;

      const factorOne =
        `(${leadingVariableTerm(c + a, 'x')}` +
        `${variableTerm(d, 'm')}` +
        `${constantTerm(sign)})`;

      const factorTwo =
        `(${leadingVariableTerm(c - a, 'x')}` +
        `${variableTerm(d, 'm')}` +
        `${constantTerm(-sign)})`;

      const answerTwo = `${factorOne}${factorTwo}`;

      /*
        One left-aligned array column:
        (a) and (b) always begin at the same position.
      */
      const q =
        `\\begin{array}{l}` +
        `\\text{(a) }${squareOne}\\\\[8pt]` +
        `\\text{(b) }${two}` +
        `\\end{array}`;

      const sol =
        `\\begin{aligned}` +
        `\\text{(a) }${squareOne}` +
        `&=(${linearOne})^{2}\\\\[8pt]` +
        `\\text{(b) }${two}` +
        `&=(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')})^{2}` +
        `-(${linearOne})^{2}\\\\` +
        `&=\\left[(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')})` +
        `+(${linearOne})\\right]` +
        `\\left[(${leadingVariableTerm(c, 'x')}${variableTerm(d, 'm')})` +
        `-(${linearOne})\\right]\\\\` +
        `&=${answerTwo}` +
        `\\end{aligned}`;

      return makeQuestion(q, [answerOne, answerTwo], sol);
    }

    function makeLevel(level) {
      const groups = [
        [genCommonMN, genCommonBinomial, genOppositeFactor, genCommonBinomialSquare, genGroupingK, genGroupingXYZ, genGroupingABC],
        [genPerfectSquare, genDifferenceSquares, genTrinomial, genGeneralQuadratic],
        [genLevelThreeI, genLevelThreeII, genLevelThreeIII, genLevelThreeIV, genLevelThreeV, genLevelThreeVI]
      ];
      const list = groups[level - 1] || groups[0];
      return list[rand(0, list.length - 1)]();
    }

    function renderKaTeX(tex, container) {
      if (!container) return;
      try {
        if (window.katex && typeof window.katex.render === 'function') {
          katex.render(tex, container, { displayMode: true, throwOnError: false });
        } else {
          container.textContent = tex;
        }
      } catch (err) {
        console.error('KaTeX render error:', err);
        container.textContent = tex;
      }
    }

    async function startQuestion(level) {
      await waitForMathLive();

      if (!mathLiveReady) {
        alert('The maths input is still loading. Please try again in a moment.');
        return;
      }

      try {
        currentQuestion = makeLevel(level);
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('practice').classList.remove('hidden');
        document.getElementById('levelTitle').textContent = `Level ${['One', 'Two', 'Three'][level - 1]} Factorization`;
        
        const qContainer = document.getElementById('questionDisplay');
        renderKaTeX(currentQuestion.questionTex, qContainer);
        
        const answersHolder = document.getElementById('answers');
        answersHolder.innerHTML = '';
        activeField = null;

        currentQuestion.answers.forEach((_, i) => {
          if (currentQuestion.answers.length > 1) {
            const label = document.createElement('p');
            label.className = 'mb-1 text-center font-bold text-slate-700';
            label.textContent = i === 0 ? '(a)' : '(b)';
            answersHolder.appendChild(label);
          }
          const field = document.createElement('math-field');
          field.id = `answer-${i}`;
          field.className = 'answer-math';
          field.setAttribute('math-virtual-keyboard-policy', 'manual');
          field.addEventListener('focusin', () => activeField = field);
          field.addEventListener('pointerdown', () => activeField = field);
          answersHolder.appendChild(field);
          if (i === 0) activeField = field;
        });

        initCanvas();
        setTimeout(resizeCanvas, 60);
        clearScratchpad();
        setTimeout(() => { if (activeField && typeof activeField.focus === 'function') activeField.focus(); }, 150);
      } catch (err) {
        console.error('startQuestion error:', err);
      }
    }

    function insertMath(value) {
  const field = activeField || document.getElementById('answer-0');

  if (!field) {
    console.error('No active answer box was found.');
    return;
  }

  try {
    field.focus();

    if (typeof field.insert === 'function') {
      field.insert(value);
    } else {
      console.error('MathLive is not ready: insert() is unavailable.');
    }
  } catch (error) {
    console.error('Math keypad insert error:', error);
  }
}

function cmdMath(command) {
  const field = activeField || document.getElementById('answer-0');

  if (!field) {
    console.error('No active answer box was found.');
    return;
  }

  try {
    field.focus();

    if (typeof field.executeCommand === 'function') {
      field.executeCommand(command);
    } else {
      console.error('MathLive is not ready: executeCommand() is unavailable.');
    }
  } catch (error) {
    console.error('Math keypad command error:', error);
  }
}

window.insertMath = insertMath;
window.cmdMath = cmdMath;
window.startQuestion = startQuestion;
  

    function clean(latex) {
      if (!latex) return '';
      return String(latex)
        .replace(/\\left|\\right|\\mleft|\\mright|\\,/g, '')
        .replace(/\\cdot/g, '*')
        .replace(/\\times/g, '*')
        .replace(/\s+/g, '')
        .replace(/[−–—]/g, '-');
    }

    function toMathJs(latex) {
      let s = clean(latex);
      if (!s) return '0';
      s = s.replace(/\\(?:d|t)?frac\{([^{}]+)\}\{([^{}]+)\}/g, '(($1)/($2))');
      s = s.replace(/\{([^{}]*)\}/g, '($1)');
      s = s.replace(/\^\(([^()]*)\)/g, '^($1)');
      s = s.replace(/\^([0-9a-zA-Z]+)/g, '^($1)');
      s = s.replace(/([0-9a-zA-Z])\(/g, '$1*(');
      s = s.replace(/\)([0-9a-zA-Z(])/g, ')*$1');
      s = s.replace(/([0-9])([a-zA-Z])/g, '$1*$2');
      while (/([a-zA-Z])([a-zA-Z])/.test(s)) {
        s = s.replace(/([a-zA-Z])([a-zA-Z])/g, '$1*$2');
      }
      return s;
    }

    function equivalent(student, expected) {
      if (!student || !expected) return false;
      try {
        if (typeof math === 'undefined' || !math.parse) {
          return clean(student) === clean(expected);
        }
        const a = math.parse(toMathJs(student));
        const b = math.parse(toMathJs(expected));
        const tests = [
          { x: 2, y: 3, z: 5, a: 7, b: 11, c: 13, m: 17, n: 19, k: 23 },
          { x: -2, y: 5, z: 3, a: 2, b: -4, c: 7, m: 11, n: -3, k: 5 },
          { x: 4, y: -3, z: 2, a: -2, b: 5, c: 7, m: -5, n: 2, k: -3 },
          { x: 3, y: 2, z: -4, a: 3, b: 2, c: -1, m: 2, n: 3, k: 4 }
        ];
        return tests.every(scope => {
          try {
            const valA = a.evaluate(scope);
            const valB = b.evaluate(scope);
            return Number.isFinite(valA) && Number.isFinite(valB) && Math.abs(valA - valB) < 1e-6;
          } catch (e) {
            return false;
          }
        });
      } catch (error) {
        return clean(student) === clean(expected);
      }
    }

    function looksFactorised(latex) {
      const s = clean(latex);
      return s.includes('(') || s.includes('^2') || s.includes('^{2}');
    }

    function checkAnswer() {
      if (!currentQuestion) return;
      try {
        const correct = currentQuestion.answers.every((answer, i) => {
          const field = document.getElementById(`answer-${i}`);
          const value = field ? field.value : '';
          return value && value.trim() && looksFactorised(value) && equivalent(value, answer);
        });

        const feedback = document.getElementById('feedback');
        const title = document.getElementById('feedbackTitle');
        const text = document.getElementById('feedbackText');
        const solutionWrap = document.getElementById('solutionWrap');
        const continueButton = document.getElementById('continueBtn');

        if (correct) {
          title.textContent = 'Correct!';
          title.style.color = '#137a4a';
          text.textContent = 'Well done. Returning to the home page…';
          solutionWrap.classList.add('hidden');
          continueButton.classList.add('hidden');
          feedback.classList.remove('hidden');
          setTimeout(() => { feedback.classList.add('hidden'); backToMenu(); }, 850);
        } else {
          title.textContent = 'Not quite';
          title.style.color = '#b42318';
          text.textContent = 'Review the solution, then continue to try this same question again.';
          const solDisplay = document.getElementById('solutionDisplay');
          renderKaTeX(currentQuestion.solutionTex, solDisplay);
          solutionWrap.classList.remove('hidden');
          continueButton.classList.remove('hidden');
          feedback.classList.remove('hidden');
        }
      } catch (err) {
        console.error('checkAnswer error:', err);
      }
    }

    function closeFeedback() {
      document.getElementById('feedback').classList.add('hidden');
      setTimeout(() => { if (activeField && typeof activeField.focus === 'function') activeField.focus(); }, 80);
    }

    function backToMenu() {
      document.getElementById('practice').classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    }

    /* ===== HIGH-RESOLUTION TOUCH CANVAS (IPAD & TABLETS) ===== */
    function initCanvas() {
      canvas = document.getElementById('scratchpad');
      if (!canvas || canvas.dataset.ready) return;
      ctx = canvas.getContext('2d');
      canvas.dataset.ready = '1';

      ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
        canvas.addEventListener(type, handleDraw, { passive: false });
      });
      window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
      if (!canvas || !ctx) return;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      const temp = document.createElement('canvas');
      temp.width = canvas.width;
      temp.height = canvas.height;
      if (canvas.width && canvas.height) {
        temp.getContext('2d').drawImage(canvas, 0, 0);
      }

      canvas.width = Math.max(rect.width * dpr, 300);
      canvas.height = Math.max(rect.height * dpr, 300);

      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#1876c9';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (temp.width && temp.height) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(temp, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }

    function handleDraw(e) {
      if (!canvas || !ctx) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      if (e.type === 'pointerdown') {
        drawing = true;
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else if (e.type === 'pointermove' && drawing) {
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        drawing = false;
        ctx.beginPath();
      }
      if (e.cancelable) e.preventDefault();
    }

    function clearScratchpad() {
      if (ctx && canvas) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }

    window.checkAnswer = checkAnswer;
    window.closeFeedback = closeFeedback;
    window.backToMenu = backToMenu;
    window.clearScratchpad = clearScratchpad;


  

  document.addEventListener('DOMContentLoaded', () => {
    initCanvas();
    });
  </script>
